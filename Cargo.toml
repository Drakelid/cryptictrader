[package]
name = "cryptictrader"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"
ordered-float = "3"
warp = "0.3"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", default-features = false, features=["clock"] }
